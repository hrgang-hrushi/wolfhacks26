[project]
name = "hack-ncsu"
version = "0.1.0"
description = "NC pavement condition pipeline: NCDOT PCS + 3DEP terrain + NAIP chips"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas",
    "pyarrow",
    "rasterio",
    "shapely",
    "pyproj",
    "lightgbm",
    "scikit-learn",
    "py3dep",
    "pysheds",
    "pystac-client",
    "planetary-computer",
    "requests",
    "tqdm",
    "numpy<2.4",  # pysheds 0.5 calls np.in1d, removed in numpy 2.4
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "timm>=1.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs data/processed/segments.parquet on this machine"]
